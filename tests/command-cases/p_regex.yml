    i
    : main
      "John Smith" "([A-Za-z]+) ([A-Za-z]+)" "\\2, \\1" 0 regsub me @ swap notify
      "foo" "(o+)" "<\\0>" 0 regsub me @ swap notify
    ;
    .
    c
    q
    @act test=here
    @link test=test.muf
  commands: |
    test
  expect: |
    Smith, John
    f<oo>

