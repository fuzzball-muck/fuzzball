    :
    :c
    :
    :d
    :
    :
    :e
    :
    :f

- name: regexp-basic
  setup: |
    @program test.muf
    i
    : main
      var vals
      var idx
      "hello" "l+" 0 regexp
      idx ! vals !
      vals @ 0 [] me @ swap notify
      idx @ 0 [] dup 0 [] intostr me @ swap notify 1 [] intostr me @ swap notify
    ;
    .
    c
    q
    @act test=here
    @link test=test.muf
  commands: |
    test
  expect: |
    ll
    3
    2

- name: regexp-groups
  setup: |
    @program test.muf
    i
    : main
      var vals
      var idx
      "foo123bar" "([a-z]+)([0-9]+)" 0 regexp
      idx ! vals !
      vals @ 0 [] me @ swap notify
      vals @ 1 [] me @ swap notify
      vals @ 2 [] me @ swap notify
      idx @ 0 [] dup 0 [] intostr me @ swap notify 1 [] intostr me @ swap notify
      idx @ 1 [] dup 0 [] intostr me @ swap notify 1 [] intostr me @ swap notify
      idx @ 2 [] dup 0 [] intostr me @ swap notify 1 [] intostr me @ swap notify
    ;
    .
    c
    q
    @act test=here
    @link test=test.muf
  commands: |
    test
  expect: |
    foo123
    foo
    123
    1
    6
    1
    3
    4
    3

