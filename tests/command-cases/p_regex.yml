- name: regsplit-normal
  setup: |
    @program test.muf
    i
    : main
      "fooXbarYbazXquux" "X|Y" 0 regsplit
      { me @ }list array_notify
    ;
    .
    c
    q
    @act test=here
    @link test=test.muf
    @set test.muf=D
  commands: |
    test
  expect: |
    foo
    bar
    baz
    quux

